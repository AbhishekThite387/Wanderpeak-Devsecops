name : Wanderpeak CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'


      - name: Install dependencies
        run: npm ci --ignore-scripts


      - name: Build application
        run: npm run build


      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


      - name: Build Docker image
        run: docker build -t wanderpeak:${{ github.sha }} .


      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd
        with:
          image-ref: 'wanderpeak:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
