name : Wanderpeak CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-actions@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
